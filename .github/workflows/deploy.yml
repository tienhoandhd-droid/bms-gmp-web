# Tự động build web (Vite) và deploy lên GitHub Pages mỗi khi push vào nhánh chính.
# Cần bật: repo → Settings → Pages → Source = "GitHub Actions".
# Cần thêm 2 secret: repo → Settings → Secrets and variables → Actions → New repository secret
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (chỉ anon key — KHÔNG dùng service_role)
#
# NÂNG CẤP v11 (2026):
#   • Node 20 → 22: Vite 8 yêu cầu Node >= 20.19 (hoặc >= 22.12). Dùng 22 LTS cho chắc.
#   • Thêm bước "npm audit" (không chặn build) để theo dõi lỗ hổng phụ thuộc.
name: Deploy web GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web        # thư mục chứa package.json của web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24            # khớp môi trường build local (Vite 7/Rollup — output tất định đa nền, hết quirk react chunk ~2× của rolldown/Vite 8)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests — Chênh áp theo người xem
        run: npm run test:unit
      # GMP: KHÔNG deploy production ở chế độ demo. Thiếu secret Supabase ⇒ FAIL, không
      # âm thầm build bản demo (bản demo lên production đọc như dữ liệu thật → nguy hiểm).
      - name: Bắt buộc có secret Supabase
        run: |
          test -n "${{ secrets.VITE_SUPABASE_URL }}" || { echo "::error::Thiếu secret VITE_SUPABASE_URL — từ chối deploy chế độ demo."; exit 1; }
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || { echo "::error::Thiếu secret VITE_SUPABASE_ANON_KEY."; exit 1; }
      # Bộ kiểm import JSX: bắt lỗi 'dùng component chưa import' mà Vite vẫn build xanh
      # (đã từng gây 3 crash runtime). CHẶN deploy nếu phát hiện.
      - name: Bộ kiểm import (kiem_tra/kiem_import.py)
        working-directory: ${{ github.workspace }}
        run: python3 kiem_tra/kiem_import.py
      # Bộ kiểm UX/UI (báo cáo 10): màu qua token · từ ngữ vận hành · contrast WCAG.
      # CHẶN deploy nếu vi phạm — nguồn: web/kiemtra-ui/.
      - name: Gate UX/UI tĩnh (màu · từ ngữ · contrast)
        run: |
          npm run check:colors
          npm run check:copy
          npm run check:contrast
      # Bộ kiểm runtime: build bản demo (env rỗng) rồi duyệt 10 tab × 2 theme × 3 viewport
      # bằng Chrome thật — bắt pageerror, tràn ngang, dark kẹt light, lộ thuật ngữ hạ tầng.
      - name: Bộ kiểm UX/UI runtime (test:ui)
        run: |
          npx puppeteer browsers install chrome
          npm run test:ui
      # Theo dõi lỗ hổng phụ thuộc mức cao — không chặn (advisory phụ thuộc gián tiếp).
      - run: npm audit --omit=dev --audit-level=high || true
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DATA_SOURCE: live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
