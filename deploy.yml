# Tự động build web (Vite) và deploy lên GitHub Pages mỗi khi push vào nhánh chính.
# Cần bật: repo → Settings → Pages → Source = "GitHub Actions".
# Cần thêm 2 secret: repo → Settings → Secrets and variables → Actions → New repository secret
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (chỉ anon key — KHÔNG dùng service_role)
#
# NÂNG CẤP v11 (2026):
#   • Node 20 → 22: Vite 8 yêu cầu Node >= 20.19 (hoặc >= 22.12). Dùng 22 LTS cho chắc.
#   • Thêm bước "npm audit" (không chặn build) để theo dõi lỗ hổng phụ thuộc.
name: Deploy web GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web        # thư mục chứa package.json của web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22            # v11: Vite 8 cần Node >= 20.19 / 22.12
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Theo dõi lỗ hổng phụ thuộc — KHÔNG chặn deploy (chỉ cảnh báo trong log).
      - run: npm audit --omit=dev || true
      - run: npm run build
        env:
          # Lấy từ repo secrets. Nếu để trống, web vẫn build và chạy ở chế độ DEMO.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DATA_SOURCE: live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
