<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EAF3F8" />
    <!-- Đợt D 04/09/2026: biểu tượng tab (hết 404 favicon), manifest PWA "Thêm vào màn hình chính". -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="robots" content="noindex" />
    <title>Thao tác sự cố — BMS GMP CPC1 Hà Nội</title>

    <!-- Bắt tay DNS/TLS tới Supabase ngay lúc parse HTML (đăng nhập/soi vé nhanh hơn). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- Skeleton chống màn trắng. Trang này CỐ TÌNH nhẹ (không dashboard/echarts). -->
    <style>
      html, body { margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      .boot {
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(155deg, #EAF3F8 0%, #FAFDFF 45%, #E2F2EE 100%);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1E3A56;
      }
      .boot__ring {
        width: 42px; height: 42px;
        border: 4px solid #CFE4EC; border-top-color: #0E7C6B;
        border-radius: 50%; animation: boot-spin 0.9s linear infinite;
      }
      .boot__title { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
      .boot__sub { font-size: 12px; color: #4A6072; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot__ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-label="Đang mở trang thao tác">
        <div class="boot__ring"></div>
        <div class="boot__title">Đang mở trang thao tác…</div>
        <div class="boot__sub">CPC1 Hà Nội · HVAC phòng sạch</div>
      </div>
    </div>
    <script type="module" src="/src/action/main.jsx"></script>
    <!-- Đăng ký SW (trễ 2s, sau khi trang đã xong việc chính): từ lần bấm nút
         email THỨ HAI trở đi trang mở tức thì từ cache (SW phục vụ action.html
         cache-first + cập nhật nền), kể cả mạng yếu/offline, và miễn nhiễm
         cửa sổ ~10' sau deploy. Precache đã LOẠI main-* (dashboard) nên người
         chỉ dùng email không tốn phần tải dashboard. -->
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          setTimeout(function () {
            navigator.serviceWorker.register('./sw.js').catch(function () { /* không chặn trang */ })
          }, 2000)
        })
      }
    </script>
  </body>
</html>
